# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
members = ["crates/node-contract", "crates/workflowd"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Catzpro01/n8n-rust-v3.0"

[workspace.dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "signature", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
subtle = "=2.6.1"
zeroize = "=1.9.0"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "hooks", "limits"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_jcs = "=0.2.0"
sha2 = "=0.10.9"
thiserror = "=2.0.16"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", default-features = false }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

# Universal scraper stack. Versions resolved against the VPS toolchain under
# MSRV 1.85.1; every feature set below is chosen to keep OpenSSL, sqlx, cmake
# and C++ bindings out of the tree.
backoff = "=0.4.0"
governor = "=0.10.4"
moka = "=0.12.16"
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls"] }
reqwest-middleware = "=0.4.1"
reqwest-retry = "=0.7.0"
scraper = "=0.27.0"
tokio-cron-scheduler = "=0.15.1"
# Transitive pins: without these, url pulls idna 1.1.0 -> icu 2.3.0, which
# requires Rust 1.88 and breaks the workspace MSRV.
url = "=2.5.4"
idna_adapter = "=1.2.0"
spider = { version = "=2.53.9", default-features = false, features = ["sync", "headers", "time", "rate_limit", "ua_generator", "encoding"] }
chromiumoxide = { version = "=0.9.1", default-features = false, features = ["rustls"] }
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "csv", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
