name: Temporary format helper

on:
  push:
    branches: ["arena/01a09a2a-n8n-rust-v3-0"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt
      - name: Format and save patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: rustfmt If runtime"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
