name: Temporary Rust format check

on:
  push:
    branches: ["arena/01a09a2a-n8n-rust-v3-0"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt
      - name: Apply Rust formatting
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git diff --cached --quiet || git commit -m "style: apply rustfmt"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
