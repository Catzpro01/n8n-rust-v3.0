name: Eco 100K Summarize acceptance

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  eco-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build workflow daemon
        run: cargo build -p workflowd --locked

      - name: Run Eco API acceptance
        shell: bash
        run: |
          set +e
          python3 -m unittest tests.acceptance.test_if_runtime.IfRuntimeAcceptance.test_eco_100k_summary_is_durable_and_rollback_is_non_destructive -v 2>&1 | tee "$RUNNER_TEMP/eco-api.log"
          status=${PIPESTATUS[0]}
          {
            echo '### Eco API acceptance output'
            echo '```text'
            cat "$RUNNER_TEMP/eco-api.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish Eco API output to check summary
        if: always()
        uses: actions/github-script@v7
        env:
          API_LOG: ${{ runner.temp }}/eco-api.log
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync(process.env.API_LOG)) return;
            const log = fs.readFileSync(process.env.API_LOG, "utf8");
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const check = checks.data.check_runs
              .filter((item) => item.name === "eco-acceptance")
              .sort((left, right) => Date.parse(right.started_at || right.created_at) - Date.parse(left.started_at || left.created_at))[0];
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title: "Eco API acceptance output",
                  summary: "Eco API acceptance\\n\\n" + log.slice(-60000),
                },
              });
            }

      - name: Install Chromium for browser acceptance
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: Run Eco browser/API acceptance
        working-directory: editor
        run: npm run test:browser:eco
