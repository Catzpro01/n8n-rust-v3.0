name: Temporary browser diagnostic

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build editor assets
        working-directory: editor
        run: npm ci && npm run build
      - name: Build workflow daemon
        run: cargo build -p workflowd --locked
      - name: Install Chromium
        working-directory: editor
        run: npx playwright install --with-deps chromium
      - name: Capture browser diagnostics
        continue-on-error: true
        run: |
          sed -i 's/stdio: \["ignore", "pipe", "pipe"\]/stdio: ["ignore", "inherit", "inherit"]/' editor/tests/run-trace.mjs
          mkdir -p .scratch
          set +e
          (cd editor && npm run test:browser) > .scratch/current-browser-test.log 2>&1
          status=$?
          printf '\nbrowser-test-exit=%s\n' "$status" >> .scratch/current-browser-test.log
          exit 0
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: .scratch/current-browser-test.log
          if-no-files-found: error
