name: Temporary browser diagnostic

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: read
  checks: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build editor assets
        working-directory: editor
        run: npm ci && npm run build
      - name: Build workflow daemon
        run: cargo build -p workflowd --locked
      - name: Install Chromium
        working-directory: editor
        run: npx playwright install --with-deps chromium
      - name: Run generate artifact diagnostics
        continue-on-error: true
        run: |
          sed -i 's/daemon.once("exit", resolve)/setTimeout(resolve, 1000)/; s/900);/20);/; s/stdio: \["ignore", "pipe", "pipe"\]/stdio: ["ignore", "inherit", "inherit"]/g' editor/tests/generate-artifact.mjs
          mkdir -p .scratch
          set +e
          grep -n 'daemon.once\|setTimeout(resolve, 1000)' editor/tests/generate-artifact.mjs > .scratch/current-browser-test.log
          (cd editor && node tests/generate-artifact.mjs) >> .scratch/current-browser-test.log 2>&1
          status=$?
          pkill -KILL -x workflowd || true
          printf '\ngenerate-artifact-test-exit=%s\n' "$status" >> .scratch/current-browser-test.log
      - name: Publish browser diagnostics to check
        if: always()
        uses: actions/github-script@v7
        env:
          LOG_FILE: ${{ github.workspace }}/.scratch/current-browser-test.log
        with:
          script: |
            const fs = require("node:fs");
            const log = fs.existsSync(process.env.LOG_FILE)
              ? fs.readFileSync(process.env.LOG_FILE, "utf8")
              : "diagnostic log was not created";
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const check = checks.data.check_runs
              .filter((item) => item.name === "diagnostic")
              .sort((left, right) => Date.parse(right.started_at || right.created_at) - Date.parse(left.started_at || left.created_at))[0];
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title: "Generate artifact browser diagnostic",
                  summary: log.slice(-60000),
                },
              });
            }
