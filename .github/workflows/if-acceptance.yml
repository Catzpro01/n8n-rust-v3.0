name: If runtime acceptance

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  if-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Build workflow daemon
        run: |
          set +e
          cargo build -p workflowd --locked 2>&1 | tee /tmp/if-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/if-build.log .scratch/if-acceptance-build.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .scratch/if-acceptance-build.log
            git commit -m "ci: capture If acceptance build diagnostic"
            git push
            exit "$status"
          fi

      - name: Run public If acceptance
        run: python3 -m unittest tests.acceptance.test_if_runtime -v
