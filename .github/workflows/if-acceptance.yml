name: If runtime acceptance

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

# Same normalized branch group as validate.yml. The self-hosted runner is
# single-concurrency, so a push and its pull_request twin used to queue as two
# full runs of the same content. These jobs have no long-lived download step,
# so a superseded run is cancelled instead of queued.
concurrency:
  group: if-acceptance-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  if-runtime:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Host prerequisites (self-hosted VPS)
        uses: ./.github/actions/host-prereqs

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run build

      - name: Build workflow daemon
        run: cargo build -p workflowd --locked

      - name: Run public If acceptance
        run: python3 -m unittest tests.acceptance.test_if_runtime -v
