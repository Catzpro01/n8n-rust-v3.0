name: Temporary Rust diagnostic

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build editor assets
        working-directory: editor
        run: npm ci && npm run build
      - name: Capture workspace test diagnostics
        run: |
          mkdir -p .scratch
          set +e
          cargo test --workspace --locked -- --test-threads=1 > .scratch/current-rust-test.log 2>&1
          status=$?
          printf '\nworkspace-test-exit=%s\n' "$status" >> .scratch/current-rust-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scratch/current-rust-test.log
          git commit -m "chore: record temporary Rust diagnostics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 0
