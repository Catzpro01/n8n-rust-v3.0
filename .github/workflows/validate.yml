name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/rust-test.log"
          status=${PIPESTATUS[0]}
          {
            echo '### Rust test output'
            echo '```text'
            tail -300 "$RUNNER_TEMP/rust-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish Rust test output
        if: always()
        uses: actions/github-script@v7
        env:
          RUST_TEST_LOG: ${{ runner.temp }}/rust-test.log
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync(process.env.RUST_TEST_LOG)) return;
            const log = fs.readFileSync(process.env.RUST_TEST_LOG, "utf8");
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const check = checks.data.check_runs
              .filter((item) => item.name === "validate")
              .sort((left, right) => Date.parse(right.started_at || right.created_at) - Date.parse(left.started_at || left.created_at))[0];
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title: "Temporary Rust test output",
                  summary: log.slice(-60000),
                },
              });
            }

      - name: Build all workspace binaries for acceptance tests
        run: cargo build --workspace --locked

      - name: Install Chromium for browser acceptance
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: Run the full browser acceptance suite
        working-directory: editor
        run: |
          npm run test:browser
          npm run test:browser:eco

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
