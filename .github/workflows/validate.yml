name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        id: rust_tests
        continue-on-error: true
        run: cargo test --workspace --locked -- --nocapture 2>&1 | tee /tmp/cargo-test.log

      - name: Preserve Rust failure diagnostics
        if: steps.rust_tests.outcome != 'success' && github.event_name == 'push'
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          cp /tmp/cargo-test.log .scratch/cargo-test-diagnostics.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scratch/cargo-test-diagnostics.log
          git commit -m "ci: preserve Rust failure diagnostics"
          git push origin "HEAD:${HEAD_REF}"

      - name: Fail Rust tests
        if: steps.rust_tests.outcome != 'success'
        run: exit 1

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
