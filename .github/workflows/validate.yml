name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Capture Rust formatting diff
        if: failure()
        run: |
          cargo fmt --all
          git diff -- crates/workflowd/src/run.rs > "$RUNNER_TEMP/rustfmt.diff"
          {
            echo '### Rust formatting diff'
            echo '```diff'
            cat "$RUNNER_TEMP/rustfmt.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust formatting diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: ${{ runner.temp }}/rustfmt.diff
          if-no-files-found: ignore

      - name: Run Rust tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build all workspace binaries for acceptance tests
        run: cargo build --workspace --locked

      - name: Install Chromium for browser acceptance
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: Run the full browser acceptance suite
        working-directory: editor
        run: |
          npm run test:browser
          npm run test:browser:eco

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
