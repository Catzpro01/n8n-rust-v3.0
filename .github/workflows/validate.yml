name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build all workspace binaries for acceptance tests
        run: cargo build --workspace --locked

      - name: Install Chromium for browser acceptance
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: "Browser acceptance: artifact generation"
        working-directory: editor
        run: node tests/generate-artifact.mjs

      - name: "Browser acceptance: two-tab editing"
        working-directory: editor
        run: node tests/two-tab.mjs

      - name: "Browser acceptance: publish rollback"
        working-directory: editor
        run: node tests/publish-rollback.mjs

      - name: "Browser acceptance: run trace"
        working-directory: editor
        run: node tests/run-trace.mjs

      - name: "Browser acceptance: field editing and run"
        working-directory: editor
        run: node tests/edit-fields-run.mjs

      - name: "Browser acceptance: Eco summarize"
        working-directory: editor
        run: node tests/eco-summarize.mjs

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v

  audit:
    # Dependency audits are a separate job: they need live advisory data from
    # npm/RustSec and must not break the hermetic build/test job when a
    # registry is unreachable.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit npm and Rust dependencies
        run: REQUIRE_CARGO_AUDIT=1 ./scripts/audit-deps.sh

  release-bundle:
    # Ticket 11: verify `make release` produces a reproducible, checksummed
    # bundle. No runtime patching of scripts: the dependency audit runs in the
    # separate `audit` job, and build-release.sh is executable in the index.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build release bundle
        run: make release

      - name: Verify bundle
        run: |
          ls -lh out/tracer-bundle/usr/bin/workflowd out/tracer-bundle.tar.gz
          head -20 out/tracer-bundle/checksums.sha256
          test -f out/tracer-bundle/usr/share/doc/workflowd/LICENSE
          python3 -m unittest tests/acceptance/test_release_bundle.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracer-bundle-${{ github.sha }}
          path: |
            out/tracer-bundle.tar.gz
            out/tracer-bundle/checksums.sha256
          if-no-files-found: error
