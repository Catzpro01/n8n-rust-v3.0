name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Capture rustfmt diagnostics
        if: always()
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > rustfmt.patch
          git diff --stat -- '*.rs'

      - name: Upload rustfmt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: rustfmt.patch
          if-no-files-found: warn

      - name: Apply Rust formatting
        if: always()
        run: cargo fmt --all

      - name: Commit Rust formatting
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format Rust sources"
          git push origin "HEAD:${HEAD_REF}"

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
