name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        id: rust_tests
        continue-on-error: true
        run: cargo test --workspace --locked -- --test-threads=1 2>&1 | tee /tmp/cargo-test.log

      - name: Publish Rust diagnostics
        if: always()
        run: |
          {
            echo '### cargo test output'
            echo '```text'
            cat /tmp/cargo-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.rust_tests.outcome }}" != "success" ]]; then
            exit 1
          fi

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
