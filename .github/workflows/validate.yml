name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Capture Rust formatting diff
        if: failure()
        run: |
          cargo fmt --all
          git diff -- crates/workflowd/src/run.rs > "$RUNNER_TEMP/rustfmt.diff"
          {
            echo '### Rust formatting diff'
            echo '```diff'
            cat "$RUNNER_TEMP/rustfmt.diff"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust formatting diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diff
          path: ${{ runner.temp }}/rustfmt.diff
          if-no-files-found: ignore

      - name: Publish Rust formatting diff
        if: always()
        uses: actions/github-script@v7
        env:
          RUSTFMT_DIFF: ${{ runner.temp }}/rustfmt.diff
        with:
          script: |
            const fs = require("node:fs");
            if (!fs.existsSync(process.env.RUSTFMT_DIFF)) return;
            const diff = fs.readFileSync(process.env.RUSTFMT_DIFF, "utf8");
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const check = checks.data.check_runs
              .filter((item) => item.name === "validate")
              .sort((left, right) => Date.parse(right.started_at || right.created_at) - Date.parse(left.started_at || left.created_at))[0];
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title: "Temporary Rust formatting diff",
                  summary: diff.slice(-60000),
                },
              });
            }

      - name: Run Rust tests
        run: cargo test --workspace --locked -- --test-threads=1

      - name: Build all workspace binaries for acceptance tests
        run: cargo build --workspace --locked

      - name: Install Chromium for browser acceptance
        working-directory: editor
        run: npx playwright install --with-deps chromium

      - name: Run the full browser acceptance suite
        working-directory: editor
        run: |
          npm run test:browser
          npm run test:browser:eco

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
