name: Validate Rust workflow platform

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt

      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Apply Rust formatting
        if: always()
        run: cargo fmt --all

      - name: Commit Rust formatting
        if: always() && github.event_name == 'push'
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: format Rust sources"
          git push origin "HEAD:${HEAD_REF}"

      - name: Run Rust tests
        id: rust_tests
        continue-on-error: true
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee ci-rust-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Publish Rust test diagnostics
        if: github.event_name == 'push' && steps.rust_tests.outcome == 'failure'
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-rust-test.log
          git commit -m "ci: capture Rust test diagnostics"
          git push origin "HEAD:${HEAD_REF}"

      - name: Fail Rust validation after publishing diagnostics
        if: steps.rust_tests.outcome == 'failure'
        run: exit 1

      - name: Run dependency-free repository tests
        run: python3 -m unittest discover -s tests -v
