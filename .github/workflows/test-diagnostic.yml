name: Temporary Rust test diagnostic

on:
  push:
    branches: ["arena/01a09a2a-n8n-rust-v3-0"]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Build editor assets
        working-directory: editor
        run: npm ci && npm run build
      - name: Capture Rust and public acceptance failures
        run: |
          set +e
          cargo test --workspace --locked -- --test-threads=1 2>&1 | tee .scratch/remote-test.log
          rust_status=${PIPESTATUS[0]}
          cargo build -p workflowd --locked
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            python3 -m unittest tests.acceptance.test_if_runtime -v 2>&1 | tee .scratch/remote-merge-acceptance.log
            acceptance_status=${PIPESTATUS[0]}
          else
            acceptance_status=$build_status
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .scratch/remote-test.log .scratch/remote-merge-acceptance.log
          git commit -m "chore: capture remote Merge acceptance diagnostic [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
          if [ "$rust_status" -ne 0 ]; then exit "$rust_status"; fi
          exit "$acceptance_status"
