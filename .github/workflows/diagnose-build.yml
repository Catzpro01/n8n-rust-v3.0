name: Temporary build diagnostic

on:
  push:
    branches: ["arena/01a09a2a-n8n-rust-v3-0"]

permissions:
  contents: read
  checks: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt
      - name: Install pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version-file: editor/.nvmrc
      - name: Build editor assets
        working-directory: editor
        run: |
          npm ci
          npm run build
      - name: Capture daemon build output
        shell: bash
        run: |
          set +e
          cargo build -p workflowd --locked > "$RUNNER_TEMP/workflowd-build.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/workflowd-build.log"
          cargo fmt --all -- --check > "$RUNNER_TEMP/workflowd-fmt.log" 2>&1
          fmt_status=$?
          cat "$RUNNER_TEMP/workflowd-fmt.log"
          {
            echo
            echo '=== cargo fmt check ==='
            cat "$RUNNER_TEMP/workflowd-fmt.log"
          } >> "$RUNNER_TEMP/workflowd-build.log"
          {
            echo '### workflowd build output'
            echo '```text'
            cat "$RUNNER_TEMP/workflowd-build.log"
            echo '```'
            echo "### cargo fmt check (exit $fmt_status)"
            echo '```text'
            cat "$RUNNER_TEMP/workflowd-fmt.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "build_status=$status fmt_status=$fmt_status"
          exit 0
      - name: Publish compiler output to check summary
        uses: actions/github-script@v7
        env:
          BUILD_LOG: ${{ runner.temp }}/workflowd-build.log
        with:
          script: |
            const fs = require("node:fs");
            const log = fs.readFileSync(process.env.BUILD_LOG, "utf8");
            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            });
            const check = checks.data.check_runs.find((item) => item.name === "diagnose");
            if (check) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: check.id,
                output: {
                  title: "Temporary workflowd build output",
                  summary: "Temporary workflowd build output\\n\\n" + log.slice(-60000),
                },
              });
            }
      - name: Upload daemon build output
        uses: actions/upload-artifact@v4
        with:
          name: workflowd-build-log
          path: ${{ runner.temp }}/workflowd-build.log
